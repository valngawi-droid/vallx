plugins { id 'com.android.application' }

android {
    namespace 'com.chipapp.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chipapp.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keyFile = System.getenv('CHIPAPP_KEYSTORE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('CHIPAPP_STORE_PASSWORD')
                keyAlias System.getenv('CHIPAPP_KEY_ALIAS')
                keyPassword System.getenv('CHIPAPP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
